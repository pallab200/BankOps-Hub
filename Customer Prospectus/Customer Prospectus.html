<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/ucb-logo.png">
    <link rel="stylesheet" href="../css/exo2.css">
    <link rel="stylesheet" href="../css/poppins.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/unified-theme.css">
    <title>Customer Prospectus</title>
    <link rel="stylesheet" href="style.css">
    <!-- Local fonts and icons for offline use -->
    <link rel="stylesheet" href="../css/poppins.css">
    <link rel="stylesheet" href="../css/fontawesome.min.css">
    <link rel="stylesheet" href="../css/fontawesome-fix.css">
</head>

<body>
    <header class="app-header" style="background: linear-gradient(135deg, #181920 0%, #291216 42%, #850f16 82%, #ed1b24 100%) !important; padding: 12px 24px; position: sticky; top: 0; z-index: 100; overflow: hidden; box-shadow: 0 6px 24px rgba(237, 27, 36, 0.22); border-bottom: 1px solid rgba(237, 27, 36, 0.35); display: flex; align-items: center; justify-content: space-between;">
        <!-- Subtle Decorative Glow Circles -->
        <div style="position: absolute; top: -60%; right: -15%; width: 55%; height: 220%; background: radial-gradient(circle, rgba(237, 27, 36, 0.22) 0%, transparent 65%); pointer-events: none;"></div>
        <div style="position: absolute; bottom: -60%; left: -15%; width: 55%; height: 220%; background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 65%); pointer-events: none;"></div>

        <div class="hub-brand-group" style="display: flex; align-items: center; gap: 14px; position: relative; z-index: 10;">
            <!-- Animated UCB Logo with Cinematic Beam, Particles & Glow -->
            <div class="ucb-logo-anim" aria-label="United Commercial Bank PLC" style="cursor: pointer;" onclick="window.location.href='../BranchEase.html'" title="Back to BranchEase Portal">
                <div class="ucb-glow"></div>
                <img class="ucb-logo-img" src="../assets/ucb-logo.png" alt="UCB"
                     onerror="this.src='assets/ucb-logo.png'; this.onerror=function(){ this.closest('.ucb-logo-anim').classList.add('.ucb-fallback'); };">
                <div class="ucb-particles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <svg class="ucb-beam" viewBox="0 0 1024 486" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                    <defs>
                        <linearGradient id="ucbBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ff2b2b" stop-opacity="0"/>
                            <stop offset="30%" stop-color="#ff2b2b" stop-opacity="0.9"/>
                            <stop offset="60%" stop-color="#ff5a5a" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
                        </linearGradient>
                    </defs>
                    <path d="M40 372 C 190 470, 470 470, 640 392 C 800 320, 900 250, 985 150"/>
                    <circle r="4" style="offset-path: path('M40 372 C 190 470, 470 470, 640 392 C 800 320, 900 250, 985 150');"></circle>
                </svg>
                <div class="ucb-sweep"></div>
            </div>

            <div class="hub-brand-titles">
                <h1 id="page-title" style="font-family: 'Exo 2', sans-serif !important; font-size: 1.45rem; font-weight: 800; margin: 0; line-height: 1.15; letter-spacing: -0.01em; background: linear-gradient(100deg, #ffffff 0%, #ffffff 40%, #ff858a 48%, #ffffff 54%, #ffffff 100%); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: ucbTextShine 7s ease-in-out infinite 2.5s;">Customer Prospectus</h1>
                <p style="margin: 2px 0 0; font-size: 0.75rem; color: rgba(255, 255, 255, 0.88); font-weight: 500;">United Commercial Bank PLC &middot; Deposit & Rates Overview</p>
            </div>
        </div>

        <div class="hub-header-meta" style="display: flex; align-items: center; gap: 10px; position: relative; z-index: 10;">
            <div class="hub-user-pill" onclick="changePcUsername()" title="Click to change display name" style="display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 6px 14px; border-radius: 50px; color: #ed1b24; font-size: 0.76rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); cursor: pointer;">
                <i class="fas fa-user-circle" style="font-size: 1rem;"></i>
                <span id="headerUsername">User</span>
            </div>
        </div>
    </header>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-vault"></i>
                <span>Customer Prospectus</span>
            </div>
            <nav>
                <ul>
                    <li class="active" data-tab="fdr-double">
                        FDR Double
                    </li>
                    <li data-tab="fdr">
                        FDR Fixed
                    </li>
                    <li data-tab="dps">
                        <span style="font-size: 1.2em;">🏦</span> DPS
                    </li>
                    <li data-tab="earning-plus">
                        <span style="font-size: 1.2em;">📈</span> Earning Plus
                    </li>
                    <li data-tab="prospectus">
                        <span style="font-size: 1.2em;">📄</span> Customer Prospectus
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="content">
            

            <div id="calculator-container" class="calculator-container">
                <!-- Content will be injected here by JS -->
            </div>
            <footer class="cp-footer no-print">Developed by Tanzil Ahmed — EID 7966.</footer>
        </main>
    </div>
    <script src="script.js"></script>
    <style>
        /* Footer visible on-screen but hidden when printing */
        .cp-footer{
            display:block;
            text-align:center;
            padding:12px;
            font-weight:700;
            font-size:0.95rem;
            color: #6b7280;
            margin-top:24px;
            /* gradient neon text matching Hub */
            background: linear-gradient(90deg,
                #ed1b24 0%, /* indigo */
                #c00000 30%, /* magenta */
                #f59e0b 60%, /* amber */
                #ed1b24 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: cpRgbShift 6s linear infinite;
        }

        @keyframes cpRgbShift{
            0%{ background-position:0% 50%; }
            50%{ background-position:100% 50%; }
            100%{ background-position:0% 50%; }
        }

        @media (prefers-reduced-motion: reduce){ .cp-footer{ animation: none; } }

        @media print{
            .cp-footer{ display:none !important; }
        }
    </style>

    <script>
        function syncHeaderUsername() {
            const el = document.getElementById("headerUsername");
            if (!el) return;
            el.textContent = localStorage.getItem("pcUsername") || "User";
        }
        syncHeaderUsername();
        window.changePcUsername = function() {
            const current = localStorage.getItem("pcUsername") || "User";
            const newName = prompt("Enter your name for BranchEase:", current);
            if (newName && newName.trim()) {
                localStorage.setItem("pcUsername", newName.trim());
                syncHeaderUsername();
            }
        };
    </script>
</body>

</html>
