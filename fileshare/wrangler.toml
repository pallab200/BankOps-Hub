name = "branchease-fileshare"
main = "src/index.js"
compatibility_date = "2024-04-01"

# 100% Free Tier Cloudflare KV Namespace for 4-Digit Codes & Metadata
[[kv_namespaces]]
binding = "METADATA"
id = "48c93d29f87f461587c9c307b5baefeb"

# 100% Free Tier Cloudflare KV Namespace for File Blobs (Native 30m TTL)
[[kv_namespaces]]
binding = "FILES"
id = "9397a67b0d2c4ddd9dee1693bc3c13fd"

# Scheduled Cron Trigger for automated auto-purging of expired files (every 10 mins)
[triggers]
crons = ["*/10 * * * *"]
